# nf-impostor.yaml — pod impostor dentro del namespace del core (5g-cp).
#
# Modela una imagen alterada en la cadena de suministro que acaba en 5g-cp. No
# lleva las etiquetas de ninguna NF (app.kubernetes.io/instance=open5gs-cp), así
# que Cilium no le da identidad de NF. Lo usa a2-nrf-desde-impostor.sh.
# Variante con etiquetas copiadas: ver k8s/admission/README.md.
apiVersion: v1
kind: Pod
metadata:
  name: nf-impostor
  namespace: 5g-cp
  labels:
    app: nf-impostor
spec:
  # Sitio de borde: cruza de nodo hacia el core. Sin token de SA.
  nodeSelector: { kubernetes.io/hostname: node-worker2 }
  automountServiceAccountToken: false
  containers:
    - name: attacker
      image: nicolaka/netshoot:v0.13
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c", "sleep infinity"]
      securityContext:
        capabilities:
          add: ["NET_RAW", "NET_ADMIN"]
  restartPolicy: Never
