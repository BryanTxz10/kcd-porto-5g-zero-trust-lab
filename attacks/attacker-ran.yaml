# attacker-ran.yaml — pod comprometido en la RAN (5g-ran).
#
# Modela un dispositivo del lado de la radio con el firmware alterado. No tiene
# credenciales del core ni token de ServiceAccount. Vive en el sitio de borde
# (node-worker2), así que cualquier intento hacia el core (node-worker1) cruza
# de nodo. Lo usan a1-movimiento-lateral.sh, a2-nrf-desde-la-ran.sh y
# a3-flood-n2.sh.
apiVersion: v1
kind: Pod
metadata:
  name: attacker-ran
  namespace: 5g-ran
  labels:
    app: attacker-ran
spec:
  # Sitio de borde: cruza de nodo hacia el core. Sin token de SA.
  nodeSelector: { kubernetes.io/hostname: node-worker2 }
  automountServiceAccountToken: false
  containers:
    - name: attacker
      image: nicolaka/netshoot:v0.13
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c", "sleep infinity"]
      securityContext:
        capabilities:
          add: ["NET_RAW", "NET_ADMIN"]
  restartPolicy: Never
