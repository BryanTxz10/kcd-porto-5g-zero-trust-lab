apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spec2policy-sbi-nssf
  namespace: 5g-cp
  labels:
    app.kubernetes.io/part-of: spec2policy
    cib46.io/managed: 'true'
  annotations:
    description: 'spec-as-policy (standard): ingress SBI de nssf con reglas HTTP por método y path derivadas
      de los OpenAPI 3GPP de nnssf-nsselection.'
    spec2policy.cib46.io/mode: standard
    spec2policy.cib46.io/services: nnssf-nsselection
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nssf
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: 5g-cp
            cib46-nf-type: core-nf
            app.kubernetes.io/name: nrf
      toPorts:
        - ports:
            - port: '7777'
              protocol: TCP
          rules:
            http:
