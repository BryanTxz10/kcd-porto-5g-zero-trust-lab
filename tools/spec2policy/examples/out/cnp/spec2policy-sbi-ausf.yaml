              - method: POST
                path: /nausf-auth/v1/prose-authentications/[^/?]+/prose-auth(\?.*)?
              - method: POST
                path: /nausf-auth/v1/rg-authentications(\?.*)?
              - method: POST
                path: /nausf-auth/v1/ue-authentications(\?.*)?
