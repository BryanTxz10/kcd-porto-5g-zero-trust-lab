# ueransim.yaml — gNB y UE simulados (UERANSIM v3.2.6) en el namespace 5g-ran.
# Las configs se montan desde ConfigMaps creados a partir de
# k8s/ueransim/{gnb,ue}.yaml (fuente de verdad del repo).
#
# Notas:
#   - Las imágenes towards5gs tienen los binarios en /ueransim/build/ (no en el
#     PATH): se invocan con ruta completa.
#   - Con una sola red (deploy_multus: false) el gNB usa la IP de SU pod para
#     radio (linkIp), N2 y N3, inyectada en gnb.yaml al arrancar. Así N2 (SCTP)
#     y N3 (GTP-U) pasan por el datapath de Cilium y sus políticas los ven.
#   - Service headless "ueransim-gnb": el UE encuentra al gNB por DNS
#     (gnbSearchList, protocolo RLS).
#   - Ambos esperan a que el DNS del otro extremo exista antes de arrancar.
#
# Redes dedicadas (deploy_multus: true, solo por Ansible): un patch añade la red
# 'access' de Multus y las variables N2_IP, N3_IP y AMF_N2_ADDR al gNB
# (ansible/templates/ueransim-gnb-multus-patch.yaml.j2). Sin ellas, el gNB
# se comporta como con una sola red. No las añadas aquí: 'kubectl apply' de este
# fichero deshará cualquier valor que fije el patch para variables que
# también estén en el manifiesto.
#
# Labels alineados con las CiliumNetworkPolicy y los checks:
#   - gNB: app.kubernetes.io/name=ueransim-gnb  (k8s/cilium/una-red/10-n2.yaml)
#   - UE : app.kubernetes.io/name=ueransim-ue; el pod contiene 'ues' en el nombre
---
apiVersion: v1
kind: Service
metadata:
  name: ueransim-gnb
  namespace: 5g-ran
  labels: { app.kubernetes.io/name: ueransim-gnb }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: ueransim-gnb }
  ports:
    - { name: rls, port: 4997, targetPort: 4997, protocol: UDP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-gnb
  namespace: 5g-ran
  labels: { app.kubernetes.io/name: ueransim-gnb }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: ueransim-gnb } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ueransim-gnb }
    spec:
      # Sitio de borde (worker2); sin token de ServiceAccount.
      nodeSelector: { kubernetes.io/hostname: node-worker2 }
      automountServiceAccountToken: false
      containers:
        - name: gnb
          image: towards5gs/ueransim-gnb:v3.2.6   # pinnea por digest para el paper
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: AMF_HOST
              value: amf-n2.5g-cp.svc.cluster.local
          command: ["/bin/bash", "-c"]
          args:
            - |
              N2_IP="${N2_IP:-$POD_IP}"
              N3_IP="${N3_IP:-$POD_IP}"
              AMF="${AMF_N2_ADDR:-$AMF_HOST}"
              until getent hosts "$AMF" >/dev/null; do
                echo "Esperando DNS del AMF ($AMF)..."; sleep 2
              done
              sed -e "s/__POD_IP__/${POD_IP}/g" -e "s/__N2_IP__/${N2_IP}/g" \
                  -e "s/__N3_IP__/${N3_IP}/g" -e "s/__AMF_N2__/${AMF}/g" \
                  /config/gnb.yaml > /tmp/gnb.yaml
              echo "gNB: radio ${POD_IP}, N2 ${N2_IP}, N3 ${N3_IP}; AMF en $(getent hosts "$AMF" | awk '{print $1}')"
              exec /ueransim/build/nr-gnb -c /tmp/gnb.yaml
          securityContext:
            capabilities: { add: ["NET_ADMIN"] }
          volumeMounts:
            - { name: gnb-conf, mountPath: /config, readOnly: true }
      volumes:
        - name: gnb-conf
          configMap: { name: ueransim-gnb-conf }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-ues
  namespace: 5g-ran
  labels: { app.kubernetes.io/name: ueransim-ue }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: ueransim-ue } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ueransim-ue }
    spec:
      # Sitio de borde (worker2); sin token de ServiceAccount.
      nodeSelector: { kubernetes.io/hostname: node-worker2 }
      automountServiceAccountToken: false
      containers:
        - name: ue
          image: towards5gs/ueransim-ue:v3.2.6    # pinnea por digest para el paper
          env:
            - name: GNB_HOST
              value: ueransim-gnb.5g-ran.svc.cluster.local
          command: ["/bin/bash", "-c"]
          args:
            - |
              mkdir -p /dev/net
              [ -c /dev/net/tun ] || mknod /dev/net/tun c 10 200
              until getent hosts "$GNB_HOST" >/dev/null; do
                echo "Esperando DNS del gNB ($GNB_HOST)..."; sleep 2
              done
              exec /ueransim/build/nr-ue -c /config/ue.yaml
          securityContext:
            privileged: true          # crea el TUN uesimtun0
          volumeMounts:
            - { name: ue-conf, mountPath: /config, readOnly: true }
      volumes:
        - name: ue-conf
          configMap: { name: ueransim-ue-conf }
