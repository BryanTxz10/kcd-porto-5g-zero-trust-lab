# Plan B (deploy_multus: false): una sola red. N2, N3 y N6 viajan por la red
# de pods, así que Cilium tiene que permitirlos explícitamente.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      kcd.io/policy-mode: una-red
      kcd.io/policy-set: lab
resources:
  - ../base
  - 10-n2.yaml
  - 11-n3.yaml
  - 12-n6-upf-world.yaml
