# all.yml — VARIABLES del despliegue (versiones y parámetros).
# Versiones, IPs e interruptores del lab.
# Guía paso a paso: docs/guia-lab-desde-cero.md
# VMs y redes (Fase 0, cuatro VMs): docs/guia-vms-realista.md
# ================== REVISA / EDITA ==================
---
# --- Kubernetes / CNI ---
k3s_version: "v1.28.5+k3s1"
cilium_version: "1.15.4"
# Pool de IPs de pods de Cilium. Igual al cluster-cidr por defecto de k3s,
# para no solapar con la red de servicios (10.43.0.0/16).
cilium_pod_cidr: "10.42.0.0/16"
cilium_cli_version: "v0.16.7"
hubble_cli_version: "v0.13.3"
metrics_server_version: "v0.7.1"

# --- Interruptor de arquitectura (docs/arquitectura.md, docs/pruebas-fase1.md) ---
# deploy_multus: true  -> TRES redes, como un operador: mgmt (VMnet8), access
#                         (LAN segment ACCESS: N2+N3) y n6 (LAN segment N6).
#                         Multus da a AMF, gNB y UPF interfaces ipvlan L2
#                         sobre las NIC 'access'/'n6' de los workers y dn-gw
#                         hace de red de datos (router N6 con CGNAT).
#                         NO verificado todavía en clúster.
# deploy_multus: false -> PLAN B, UNA sola red: todo viaja por la red de pods
#                         de Cilium. Solo hace falta la NIC
#                         mgmt; dn-gw no se usa y puede estar apagada.
deploy_multus: false
# Multus thick (daemonset). Manifiesto del tag fijado; las rutas de CNI del
# host se ajustan a las que use k3s (se detectan, ver cni_*_dir_default).
multus_version: "v4.0.2"
# Límite de memoria del daemon kube-multus. El manifiesto trae 50Mi y no
# aguanta un arranque en frío (OOMKilled al recrear todos los sandboxes).
multus_memory_limit: "300Mi"
# Plugins CNI de referencia que delega Multus (ipvlan, static). Cilium solo
# instala cilium-cni. Se verifican con el .sha256 publicado junto al tarball.
cni_plugins_version: "v1.4.1"
# Rutas de CNI por defecto. El playbook lee las reales de la config de
# containerd que genera k3s (bin_dir / conf_dir) y solo usa estas si no las
# encuentra. Con --flannel-backend=none deberían coincidir; se comprueba.
cni_bin_dir_default: "/opt/cni/bin"
cni_conf_dir_default: "/etc/cni/net.d"
# NIC padre de las ipvlan en los workers. Netplan las renombra por MAC (Fase 0)
# y deben llamarse igual en todos los workers: el NAD es del namespace, no del
# nodo.
multus_access_iface: "access"
multus_n6_iface: "n6"

# Plan de direcciones de las redes access y n6 (solo con deploy_multus: true).
access_cidr: "10.10.0.0/24"
n6_cidr: "10.10.6.0/24"
amf_n2_ip: "10.10.0.10"        # AMF (N2), corre en node-worker1
gnb_access_ip: "10.10.0.20"    # gNB (N2 y N3), corre en node-worker2
upf_n3_ip: "10.10.0.30"        # UPF lado N3, corre en node-worker2
upf_n6_ip: "10.10.6.30"        # UPF lado N6, corre en node-worker2
dn_gw_n6_ip: "10.10.6.1"       # dn-gw, puerta de enlace de N6
ue_pool_cidr: "10.45.0.0/16"   # pool de IP de los UE (sesiones PDU)

# NetworkAttachmentDefinition (son por namespace). ipvlan L2 con IPAM static:
# la IP la pide cada pod en su anotación (campo "ips"), y quién puede pedir
# qué red lo decide Kyverno en admisión (Fase 2). Plantilla:
# templates/multus-nads.yaml.j2
multus_networks:
  - { name: access, master: "{{ multus_access_iface }}", namespaces: ["{{ ns_cp }}", "{{ ns_ran }}", "{{ ns_up }}"] }
  # n6 usa host-device: la NIC entera pasa al pod del UPF (equivalente de
  # laboratorio a una VF de SR-IOV). ipvlan reparte por IP de destino y no
  # entrega al UPF el retorno hacia el pool de UE (tráfico enrutado detrás del
  # pod). Para volver atrás: quitar 'type' (por defecto, ipvlan).
  - { name: n6, master: "{{ multus_n6_iface }}", namespaces: ["{{ ns_up }}"], type: host-device }

# Tabla de policy routing del UPF: lo que sale del pool de UE va por n6 hacia
# dn-gw; el resto del pod (N4, DNS) sigue por eth0 (Cilium).
upf_n6_route_table: 100

# Servicios de la red de datos en dn-gw (destino local para los UE, además de
# internet). Escuchan solo en la IP de n6.
dn_iperf3_port: 5201
dn_http_port: 8080

# --- Controles de las redes dedicadas (Fase 2, solo con deploy_multus: true) ---
# Cilium no hace cumplir políticas en las interfaces de Multus. Tres capas:
#   1) aislamiento L2: los LAN segments de VMware (equivalente a VLAN/VRF);
#   2) admisión con Kyverno: quién puede pedir 'access'/'n6'
#      (ClusterPolicy kcd-multus-network-guard en
#      k8s/admission/kyverno-redes-dedicadas.yaml);
#   3) MultiNetworkPolicy con multi-networkpolicy-iptables (k8s/multinetwork/).
# Kyverno 1.11.4 (chart 3.1.4) soporta Kubernetes 1.25-1.28.
kyverno_chart_version: "3.1.4"
kyverno_kubectl_image: "bitnamilegacy/kubectl"
# Enforce rechaza; Audit solo registra (útil si la política bloquea algo
# legítimo la primera vez: kubectl get policyreport -A).
kyverno_multus_guard_action: "Enforce"
# Segundos que el gNB espera antes de abrir N2, para que MultiNetworkPolicy
# ya tenga sus reglas en el pod (si no, la asociación SCTP se pierde a los
# ~30 s; ver k8s/manifests/ueransim.yaml).
gnb_start_delay: 20
# multi-networkpolicy-iptables: si no soporta ipvlan o SCTP en tu clúster, pon
# false y quédate con L2 + admisión (docs/pruebas-fase2.md §4).
deploy_multi_networkpolicy: true
# ⚠ VERIFICAR que el tag existe (manifiesto deploy.yml e imagen en ghcr.io):
#   el playbook falla al descargarlo si no.
multi_networkpolicy_version: "cbf2b11730b9fb0477d8d578129609df0c51f06b"
multi_networkpolicy_image_tag: "snapshot"
multi_networkpolicy_crd_version: "v1.0.1"

# --- mTLS en la SBI (Fase 4) ---
# sbi_tls: true -> todas las NF hablan HTTPS con certificado de cliente
#   (TS 33.501 §13.1). Ansible genera en el master una CA propia y un
#   certificado por NF (SAN = nombres de su Service), los monta como Secret y
#   pone en cada NF un open5gs.yaml completo con default.tls.server/client
#   (customOpen5gsConfig). Las URI del NRF y del SCP pasan a https://.
#   Con TLS la regla L7 de Cilium sobre el NRF queda ciega: se aplica el
#   overlay <modo>-tls, solo L3/L4.
# Ninguna clave va al repo: se generan al desplegar y se quedan en el master.
sbi_tls: false
sbi_tls_dir: "/etc/kcd-lab/pki/sbi"
sbi_tls_days: 365
sbi_tls_mount: "/etc/open5gs/tls"
# NF con SBI (una por Deployment del release open5gs-cp) y el pod de prueba.
sbi_nfs: [nrf, scp, amf, smf, ausf, udm, udr, pcf, nssf, bsf]
# MongoDB del chart (subchart de Bitnami): Service <release>-mongodb.
# ⚠ Nombre por verificar con helm template (docs/pruebas-fase4.md §2).
open5gs_db_uri: "mongodb://{{ open5gs_release }}-mongodb.{{ ns_cp }}.svc.cluster.local/open5gs"
# Servidores DNS que el SMF entrega a los UE.
ue_dns: ["8.8.8.8", "8.8.4.4"]

# --- Tetragon (Fase 6) ---
# Observa y corta en el kernel (eBPF): mata una shell o una herramienta de red
# dentro del AMF antes de que se ejecute, y registra qué proceso abre sockets
# en las redes access y n6 (k8s/tetragon/). Funciona aunque la SBI vaya
# cifrada. Es independiente de la versión de Cilium (se instala con su propio
# chart del repo de Cilium); 1.1.x soporta TracingPolicyNamespaced.
# ⚠ VERIFICAR que la versión del chart existe: el playbook falla si no.
deploy_tetragon: true
tetragon_chart_version: "1.1.2"

# --- Núcleo 5G (chart Helm de Gradiant, Open5GS 2.7.5) ---
# El repo towards5gs-helm NO publica un chart de Open5GS (solo free5GC y
# UERANSIM); los values del repo corresponden al chart de Gradiant.
open5gs_chart: "oci://registry-1.docker.io/gradiantcharts/open5gs"
open5gs_chart_version: "2.3.4"
# El nombre del release define los nombres de servicios y deployments
# (open5gs-cp-amf, open5gs-cp-nrf-sbi...). Lo usan gnb.yaml, las políticas y
# los scripts. No lo cambies.
open5gs_release: "open5gs-cp"
# Plano de usuario: el UPF es un segundo release del mismo
# chart, en el namespace 5g-up. De este nombre salen los Services
# open5gs-up-upf-pfcp (N4) y open5gs-up-upf-gtpu (N3). Si lo cambias, cambia
# también smf.config.upf.pfcp.hostname en k8s/helm-values/open5gs-values.yaml.
open5gs_up_release: "open5gs-up"

# --- Cifrado entre nodos (Fase 3) ---
# WireGuard de Cilium entre nodos: protege la SBI y N4 cuando cruzan del sitio
# central (worker1) al de borde (worker2), en línea con TS 33.501 §9.9
# (interfaces internas no SBA). Apagado por defecto para no tocar el plan B
# hasta que el resto funcione; actívalo con true y relanza --tags cilium.
# Comprobar que las reglas L7 del NRF siguen funcionando con WireGuard en
# 1.15: docs/pruebas-fase3.md §3.
node_encryption: false

# --- Políticas de Cilium del lab (Fase 3) ---
# Al final del despliegue se aplica k8s/cilium/<modo>, con
# modo = multus si deploy_multus es true y una-red si es false. false deja el
# clúster sin políticas (útil para depurar el core).
apply_cilium_policies: true

# --- RAN simulada ---
ueransim_version: "v3.2.6"

# --- Imágenes (fíjalas por digest cuando las tengas descargadas) ---
netshoot_image: "nicolaka/netshoot:v0.13"
ueransim_gnb_image: "towards5gs/ueransim-gnb:v3.2.6"
ueransim_ue_image: "towards5gs/ueransim-ue:v3.2.6"

# --- Parámetros del testbed ---
plmn_mcc: "999"
plmn_mnc: "70"
ns_cp: "5g-cp"
ns_ran: "5g-ran"
ns_up: "5g-up"

# Ruta del kubeconfig que crea k3s en el master (no cambiar salvo que sepas).
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
