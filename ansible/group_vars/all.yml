# all.yml — VARIABLES del despliegue (versiones y parámetros).
# Equivale a bootstrap/versions.env, pero en formato Ansible.
# Guía paso a paso: docs/guia-lab-desde-cero.md
# VMs y redes (Fase 0, cuatro VMs): docs/guia-vms-realista.md
# ================== REVISA / EDITA ==================
---
# --- Kubernetes / CNI ---
k3s_version: "v1.28.5+k3s1"
cilium_version: "1.15.4"
# Pool de IPs de pods de Cilium. Igual al cluster-cidr por defecto de k3s,
# para no solapar con la red de servicios (10.43.0.0/16).
cilium_pod_cidr: "10.42.0.0/16"
cilium_cli_version: "v0.16.7"
hubble_cli_version: "v0.13.3"
metrics_server_version: "v0.7.1"

# --- Interruptor de arquitectura (docs/guia-vms-realista.md, docs/fase1-multus.md) ---
# deploy_multus: true  -> arquitectura de TRES redes: mgmt (VMnet8), access
#                         (LAN segment ACCESS, N2+N3) y n6 (LAN segment N6).
#                         Multus da a AMF, gNB y UPF interfaces ipvlan L2
#                         sobre las NIC 'access'/'n6' de los workers (un NAD
#                         con IP estática por NF, ver multus_nads), y dn-gw
#                         hace de router N6 con MASQUERADE hacia internet.
#                         Fase 1. NO verificado aún en clúster.
# deploy_multus: false -> plan B, UNA sola red: todo viaja por la red de pods
#                         de Cilium (así lo vieron las políticas C1-C3 en el
#                         lab v2). Solo hace falta la NIC mgmt; dn-gw no se usa.
deploy_multus: false
multus_version: "v4.0.2"
# Plugins CNI de referencia (ipvlan, static) que Multus delega. Cilium solo
# instala cilium-cni en /opt/cni/bin, así que hay que traerlos. Se verifican
# con el .sha256 publicado junto al tarball.
cni_plugins_version: "v1.4.1"
cni_bin_dir: "/opt/cni/bin"
# Nombre de las NIC padre de las ipvlan en los workers. Netplan las renombra
# por MAC (ver la guía); deben llamarse igual en todos los workers porque el
# NAD es del clúster, no del nodo.
multus_master_iface: "access"
multus_n6_iface: "n6"

# Plan de direcciones de las redes access y n6 (solo con deploy_multus: true).
# IP fijas de las NF en la red de acceso y en N6, y pool de los UE.
access_cidr: "10.10.0.0/24"
n6_cidr: "10.10.6.0/24"
amf_n2_ip: "10.10.0.10"        # AMF (N2), corre en node-worker1
gnb_access_ip: "10.10.0.20"    # gNB (N2 y N3), corre en node-worker2
upf_n3_ip: "10.10.0.30"        # UPF lado N3, corre en node-worker2
upf_n6_ip: "10.10.6.30"        # UPF lado N6, corre en node-worker2
dn_gw_n6_ip: "10.10.6.1"       # dn-gw, puerta de enlace de N6
ue_pool_cidr: "10.45.0.0/16"   # pool de IP de los UE (sesiones PDU)

# Un NetworkAttachmentDefinition por interfaz de NF, con su IP fija dentro
# (IPAM static). Así cada NAD es auditable por sí solo ("upf-n6 = 10.10.6.30
# sobre n6") y un pod que no debe estar en la red no puede pedir IP en ella.
# 'iface' es el nombre de la interfaz dentro del pod. Plantilla:
# templates/multus-nads.yaml.j2
multus_nads:
  - { name: amf-n2, namespace: "{{ ns_cp }}", master: "{{ multus_master_iface }}", ip: "{{ amf_n2_ip }}", cidr: "{{ access_cidr }}", iface: n2 }
  - { name: gnb-access, namespace: "{{ ns_ran }}", master: "{{ multus_master_iface }}", ip: "{{ gnb_access_ip }}", cidr: "{{ access_cidr }}", iface: access }
  - { name: upf-n3, namespace: "{{ ns_up }}", master: "{{ multus_master_iface }}", ip: "{{ upf_n3_ip }}", cidr: "{{ access_cidr }}", iface: n3 }
  - { name: upf-n6, namespace: "{{ ns_up }}", master: "{{ multus_n6_iface }}", ip: "{{ upf_n6_ip }}", cidr: "{{ n6_cidr }}", iface: n6 }

# Tabla de rutas del UPF para el tráfico de los UE (policy routing: lo que
# sale del pool 10.45.0.0/16 va por n6 hacia dn-gw; el resto, N4 incluido,
# sigue por la red de pods de Cilium).
upf_n6_route_table: 106

# --- Núcleo 5G (chart Helm de Gradiant, Open5GS 2.7.5) ---
# El repo towards5gs-helm NO publica un chart de Open5GS (solo free5GC y
# UERANSIM); los values del repo corresponden al chart de Gradiant.
open5gs_chart: "oci://registry-1.docker.io/gradiantcharts/open5gs"
open5gs_chart_version: "2.3.4"
# El nombre del release define los nombres de servicios y deployments
# (open5gs-cp-amf, open5gs-cp-nrf-sbi...). Lo usan gnb.yaml, los checks y los
# scripts de C2. No lo cambies.
open5gs_release: "open5gs-cp"
# Plano de usuario (arquitectura v3): el UPF es un segundo release del mismo
# chart, en el namespace 5g-up. De este nombre salen los Services
# open5gs-up-upf-pfcp (N4) y open5gs-up-upf-gtpu (N3). Si lo cambias, cambia
# también smf.config.upf.pfcp.hostname en helm-values/open5gs-values.yaml.
open5gs_up_release: "open5gs-up"

# --- Identidad: SPIRE integrado en Cilium (mutual authentication, beta) ---
# Cilium instala SPIRE (namespace cilium-spire), el operador registra una
# entrada SPIFFE por cada identidad de Cilium y las políticas con
#   authentication: { mode: required }
# exigen un handshake mTLS entre nodos antes de dejar pasar el tráfico.
# Open5GS no necesita soportar SPIFFE: lo hace Cilium por debajo.
deploy_spire: true
spire_trust_domain: "cib46.5gcore.local"   # el mismo trust domain de la tesis
spire_version: "1.8.5"                     # informativo: lo fija el chart de Cilium 1.15.4

# --- Hardening Perfil A (arquitectura v2) ---
# Cifrado transparente WireGuard entre nodos (hallazgo 6). APAGADO por defecto:
# es una CONDICIÓN APARTE que vuelve a medir la latencia. Actívalo con true o,
# en la ruta bash, con DEPLOY_ENCRYPTION=1 (bootstrap/20-cilium.sh).
node_encryption: false

# --- RAN simulada ---
ueransim_version: "v3.2.6"

# --- Imágenes (PINNEA POR DIGEST para calidad-paper; ver legacy/REPRODUCIBILITY.md) ---
netshoot_image: "nicolaka/netshoot:v0.13"
ueransim_gnb_image: "towards5gs/ueransim-gnb:v3.2.6"
ueransim_ue_image: "towards5gs/ueransim-ue:v3.2.6"

# --- Parámetros del testbed ---
plmn_mcc: "999"
plmn_mnc: "70"
ns_cp: "5g-cp"
ns_ran: "5g-ran"
ns_up: "5g-up"

# Ruta del kubeconfig que crea k3s en el master (no cambiar salvo que sepas).
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
