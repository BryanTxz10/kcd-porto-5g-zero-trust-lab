# site.yml — Despliegue completo del lab con Ansible.
#
# Describe el estado deseado del clúster y lo consigue de forma idempotente
# (puedes re-ejecutarlo sin romper nada).
#
# Uso (desde la carpeta ansible/):
#   ansible-playbook site.yml -K                 # todo (-K pide la clave de sudo)
#   ansible-playbook site.yml -K --tags cilium   # solo una parte
#
# Guía paso a paso desde VMs vacías: docs/guia-lab-desde-cero.md
#
# Qué despliega:
#   - k3s (sin flannel ni kube-proxy) con --node-ip explícito.
#   - Cilium (kube-proxy replacement, L7, SCTP, Hubble) con pool de pods
#     10.42.0.0/16 y las CLIs cilium/hubble en el master.
#   - Open5GS (chart OCI de Gradiant) en DOS releases: "open5gs-up" (UPF,
#     ns 5g-up, sitio de borde) y "open5gs-cp" (plano de control, ns 5g-cp,
#     sitio central). Suscriptor vía populate del chart.
#   - UERANSIM (gNB y UE) en 5g-ran.
#   - Las políticas de Cilium del modo elegido (k8s/cilium/).
#
# Interruptores (ansible/group_vars/all.yml):
#   deploy_multus   redes dedicadas access (N2+N3) y n6 con Multus, dn-gw,
#                   admisión con Kyverno y MultiNetworkPolicy.
#                   NO verificado en clúster todavía: docs/pruebas-fase1.md.
#                   Detalle: rutas de CNI leídas de la config de containerd de
#                   k3s; Multus thick con versión fijada y Cilium con
#                   cni.exclusive=false; NAD 'access' (5g-cp, 5g-ran, 5g-up) y
#                   'n6' (5g-up), ipvlan L2 con IPAM static; AMF con NGAP en
#                   access (amf.yaml completo en customOpen5gsConfig); UPF con
#                   GTP-U en n3, sin NAT y con policy routing del pool por n6;
#                   gNB con N2/N3 en access; dn-gw con ip_forward, ruta al pool
#                   de UE, CGNAT, firewall de N6 y servicios iperf3/HTTP.
#   sbi_tls         mTLS en la SBI con una CA generada al desplegar.
#   node_encryption WireGuard de Cilium entre nodos.
#   deploy_tetragon Tetragon y sus TracingPolicy.
# Con deploy_multus: false (plan B) todo viaja por la red de pods: N2 llega al
# AMF por un Service headless (Cilium 1.15 no soporta SCTP sobre VIP con KPR).
---

# =====================================================================
# PLAY 1 — Preparación del host (TODOS los nodos)
# =====================================================================
- name: "Preparar el sistema operativo en todos los nodos"
  hosts: cluster
  become: true
  tags: [prereqs]
  tasks:
    - name: "Instalar paquetes base"
      ansible.builtin.apt:
        name: [curl, tar, apt-transport-https]
        state: present
        update_cache: true

    - name: "Cargar el módulo SCTP (necesario para N2/NGAP y el vector A3)"
      ansible.builtin.shell: "modprobe sctp && lsmod | grep -q '^sctp'"
      changed_when: false

    - name: "Hacer SCTP persistente entre reinicios"
      ansible.builtin.copy:
        dest: /etc/modules-load.d/sctp.conf
        content: "sctp\n"
        mode: "0644"

    - name: "Desactivar swap ahora (Kubernetes lo recomienda)"
      ansible.builtin.command: "swapoff -a"
      changed_when: false

    - name: "Desactivar swap de forma persistente (comenta la línea en fstab)"
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

# =====================================================================
# PLAY 1b — dn-gw: router N6 con CGNAT (Fase 1, solo con deploy_multus)
# =====================================================================
# No es nodo de k3s (grupo [dn], fuera de 'cluster'). Variables en
# host_vars/dn-gw.yml. Con deploy_multus: false no se toca dn-gw.
- name: "Configurar dn-gw (router N6)"
  hosts: dn
  become: true
  # Sin facts: con deploy_multus: false dn-gw puede estar apagada y el play
  # no debe intentar conectarse (todas las tareas se saltan por el 'when').
  gather_facts: false
  tags: [dn-gw]
  vars:
    dn_services:
      - name: dn-iperf3
        desc: "iperf3 en {{ dn_gw_n6_ip }}:{{ dn_iperf3_port }}"
        cmd: "/usr/bin/iperf3 -s -B {{ dn_gw_n6_ip }} -p {{ dn_iperf3_port }}"
      - name: dn-http
        desc: "HTTP en {{ dn_gw_n6_ip }}:{{ dn_http_port }}"
        cmd: "/usr/bin/python3 -m http.server {{ dn_http_port }} --bind {{ dn_gw_n6_ip }} --directory /srv/dn"
  tasks:
    - name: "dn-gw: reenvío, ruta al pool de UE y MASQUERADE"
      when: deploy_multus | bool
      block:
        - name: "Instalar iptables"
          ansible.builtin.apt:
            name: [iptables]
            state: present
            update_cache: true

        - name: "Directorio de la red de datos"
          ansible.builtin.file:
            path: /srv/dn
            state: directory
            mode: "0755"

        - name: "Activar ip_forward de forma persistente"
          ansible.builtin.copy:
            dest: /etc/sysctl.d/90-dn-gw.conf
            content: "net.ipv4.ip_forward = 1\n"
            mode: "0644"
          register: dn_sysctl

        - name: "Aplicar sysctl"
          ansible.builtin.command: "sysctl --system"
          when: dn_sysctl.changed
          changed_when: true

        - name: "Ruta {{ ue_pool_route.to }} via {{ ue_pool_route.via }} (netplan)"
          ansible.builtin.template:
            src: templates/dn-gw-routes.yaml.j2
            dest: /etc/netplan/70-dn-gw-routes.yaml
            mode: "0600"
          register: dn_routes

        - name: "netplan apply"
          ansible.builtin.command: "netplan apply"
          when: dn_routes.changed
          changed_when: true

        - name: "Script de NAT"
          ansible.builtin.template:
            src: templates/dn-gw-nat.sh.j2
            dest: /usr/local/sbin/dn-gw-nat.sh
            mode: "0755"
          register: dn_nat_script

        - name: "Unidad systemd dn-gw-nat"
          ansible.builtin.template:
            src: templates/dn-gw-nat.service.j2
            dest: /etc/systemd/system/dn-gw-nat.service
            mode: "0644"
          register: dn_nat_unit

        - name: "Habilitar y (re)aplicar dn-gw-nat"
          ansible.builtin.systemd:
            name: dn-gw-nat
            enabled: true
            daemon_reload: "{{ dn_nat_unit.changed }}"
            state: "{{ 'restarted' if (dn_nat_script.changed or dn_nat_unit.changed) else 'started' }}"

        # Servicios de la red de datos: destino local para los UE (además de
        # internet), útil para medir con iperf3 o probar HTTP sin salir del lab.
        - name: "Instalar iperf3 y python3 (servicios de la red de datos)"
          ansible.builtin.apt:
            name: [iperf3, python3]
            state: present

        - name: "Página de prueba de la red de datos"
          ansible.builtin.copy:
            dest: /srv/dn/index.html
            content: "dn-gw: red de datos del lab (N6). Si lees esto desde un UE, N6 funciona.\n"
            mode: "0644"

        - name: "Unidades systemd de los servicios de la red de datos"
          ansible.builtin.template:
            src: templates/dn-gw-service.service.j2
            dest: "/etc/systemd/system/{{ svc.name }}.service"
            mode: "0644"
          loop: "{{ dn_services }}"
          loop_control: { loop_var: svc, label: "{{ svc.name }}" }
          register: dn_svc_units

        - name: "Habilitar y arrancar los servicios de la red de datos"
          ansible.builtin.systemd:
            name: "{{ svc.name }}"
            enabled: true
            daemon_reload: true
            state: "{{ 'restarted' if dn_svc_units.changed else 'started' }}"
          loop: "{{ dn_services }}"
          loop_control: { loop_var: svc, label: "{{ svc.name }}" }

        - name: "Comprobar la ruta al pool de UE"
          ansible.builtin.command: "ip route show {{ ue_pool_route.to }}"
          register: dn_route_check
          changed_when: false
          failed_when: ue_pool_route.via not in dn_route_check.stdout

# =====================================================================
# PLAY 2 — k3s SERVER en el master (sin CNI ni kube-proxy: lo hace Cilium)
# =====================================================================
- name: "Instalar k3s server en el master"
  hosts: master
  become: true
  tags: [k3s]
  tasks:
    - name: "¿k3s ya instalado?"
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: "Instalar k3s server (flannel/kube-proxy/traefik desactivados)"
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="server \
            --node-ip={{ ansible_host }} \
            --flannel-backend=none \
            --disable-network-policy \
            --disable-kube-proxy \
            --disable=traefik \
            --disable=servicelb \
            --write-kubeconfig-mode=644" \
          sh -
      when: not k3s_bin.stat.exists
      changed_when: true

    - name: "Esperar a que el API server responda"
      ansible.builtin.command: "k3s kubectl get --raw=/readyz"
      environment: { KUBECONFIG: "{{ kubeconfig_path }}" }
      register: readyz
      retries: 30
      delay: 4
      until: readyz.rc == 0
      changed_when: false

    - name: "Crear ~/.kube del usuario"
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: "Dejar el kubeconfig en el HOME del usuario (kubectl/helm sin sudo)"
      ansible.builtin.copy:
        src: "{{ kubeconfig_path }}"
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: "Leer el node-token (para unir a los workers)"
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_b64

    - name: "Guardar token e IP del master como hechos compartidos"
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_b64.content | b64decode | trim }}"
        master_ip: "{{ ansible_host }}"

# =====================================================================
# PLAY 3 — k3s AGENT en los workers (se unen al master)
# =====================================================================
- name: "Unir los workers al clúster"
  hosts: workers
  become: true
  tags: [k3s]
  tasks:
    - name: "¿k3s ya instalado en el worker?"
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_agent_bin

    - name: "Instalar k3s agent apuntando al master"
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="https://{{ hostvars[groups['master'][0]].master_ip }}:6443" \
          K3S_TOKEN="{{ hostvars[groups['master'][0]].k3s_token }}" \
          INSTALL_K3S_EXEC="agent --node-ip={{ ansible_host }}" \
          sh -
      when: not k3s_agent_bin.stat.exists
      changed_when: true

# =====================================================================
# PLAY 3b — Rutas de CNI de k3s y plugins para Multus (deploy_multus)
# =====================================================================
# k3s genera la config de containerd con las rutas de CNI que usa el kubelet
# (bin_dir y conf_dir). Se leen de ahí en vez de suponerlas: con
# --flannel-backend=none deberían ser /opt/cni/bin y /etc/cni/net.d, pero si
# no lo son, Cilium, Multus y los plugins deben ir donde k3s los busca.
- name: "Rutas de CNI de k3s y plugins ipvlan/static"
  hosts: cluster
  become: true
  tags: [multus]
  tasks:
    - name: "Detectar rutas de CNI y plugins"
      when: deploy_multus | bool
      block:
        - name: "Esperar a la config de containerd que genera k3s"
          ansible.builtin.wait_for:
            path: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
            timeout: 120

        - name: "Leer la config de containerd de k3s"
          ansible.builtin.slurp:
            src: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
          register: k3s_containerd

        - name: "Rutas de CNI efectivas en este nodo"
          ansible.builtin.set_fact:
            cni_bin_dir: "{{ (k3s_containerd.content | b64decode | regex_search('bin_dir\\s*=\\s*\"([^\"]+)\"', '\\1') | default([cni_bin_dir_default], true))[0] }}"
            cni_conf_dir: "{{ (k3s_containerd.content | b64decode | regex_search('conf_dir\\s*=\\s*\"([^\"]+)\"', '\\1') | default([cni_conf_dir_default], true))[0] }}"

        - name: "Mostrar las rutas detectadas"
          ansible.builtin.debug:
            msg: "bin_dir={{ cni_bin_dir }} conf_dir={{ cni_conf_dir }}"

        # Todos los nodos deben coincidir: Multus es un DaemonSet con un único
        # hostPath para todo el clúster.
        - name: "Las rutas coinciden con las del master"
          ansible.builtin.assert:
            that:
              - cni_bin_dir == hostvars[groups['master'][0]].cni_bin_dir
              - cni_conf_dir == hostvars[groups['master'][0]].cni_conf_dir
            fail_msg: "Rutas de CNI distintas entre nodos; revisa la versión de k3s de cada uno."

        - name: "¿Están ya ipvlan y static?"
          ansible.builtin.stat:
            path: "{{ cni_bin_dir }}/ipvlan"
          register: cni_ipvlan

        - name: "Descargar cni-plugins {{ cni_plugins_version }} (verificado con su .sha256)"
          ansible.builtin.get_url:
            url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz"
            checksum: "sha256:https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz.sha256"
            dest: "/tmp/cni-plugins-{{ cni_plugins_version }}.tgz"
            mode: "0644"
          when: not cni_ipvlan.stat.exists

        - name: "Crear {{ cni_bin_dir }}"
          ansible.builtin.file:
            path: "{{ cni_bin_dir }}"
            state: directory
            mode: "0755"

        # Solo los dos que hacen falta: no se pisa cilium-cni ni nada más.
        - name: "Instalar ipvlan y static en {{ cni_bin_dir }}"
          ansible.builtin.unarchive:
            src: "/tmp/cni-plugins-{{ cni_plugins_version }}.tgz"
            dest: "{{ cni_bin_dir }}"
            remote_src: true
            include: ["./ipvlan", "./static"]
          when: not cni_ipvlan.stat.exists

# =====================================================================
# PLAY 4 — Componentes del clúster (se ejecutan EN el master)
# =====================================================================
- name: "Desplegar CNI, core 5G y RAN simulada"
  hosts: master
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  vars:
    repo_root: "{{ playbook_dir }}/.."
    work_dir: /tmp/kcd-lab
  tasks:
    - name: "Crear directorio de trabajo en el master"
      ansible.builtin.file: { path: "{{ work_dir }}", state: directory, mode: "0755" }
      tags: [always]

    # ---------- Helm ----------
    - name: "¿Helm instalado?"
      ansible.builtin.command: "which helm"
      register: helm_check
      failed_when: false
      changed_when: false
      tags: [always]

    - name: "Instalar Helm 3"
      ansible.builtin.shell: "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
      when: helm_check.rc != 0
      changed_when: true
      tags: [always]

    # ---------- Cilium (CNI + KPR + L7 + SCTP + Hubble) ----------
    - name: "Añadir repo Helm de Cilium"
      ansible.builtin.command: "helm repo add cilium https://helm.cilium.io"
      register: r
      changed_when: "'has been added' in r.stdout"
      failed_when: r.rc != 0 and 'already exists' not in r.stderr
      tags: [cilium]

    - name: "helm repo update"
      ansible.builtin.command: "helm repo update"
      changed_when: false
      tags: [cilium]

    - name: "Instalar/actualizar Cilium"
      ansible.builtin.command: >
        helm upgrade --install cilium cilium/cilium
        --version {{ cilium_version }}
        --namespace kube-system
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ ansible_host }}
        --set k8sServicePort=6443
        --set l7Proxy=true
        --set rollOutCiliumPods=true
        --set sctp.enabled=true
        --set operator.replicas=1
        --set ipam.mode=cluster-pool
        --set ipam.operator.clusterPoolIPv4PodCIDRList={ {{- cilium_pod_cidr -}} }
        --set hubble.enabled=true
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
        {% if deploy_multus | bool %}
        --set cni.exclusive=false
        --set cni.binPath={{ cni_bin_dir | default(cni_bin_dir_default) }}
        --set cni.confPath={{ cni_conf_dir | default(cni_conf_dir_default) }}
        {% endif %}
        {% if node_encryption | default(false) | bool %}
        --set encryption.enabled=true
        --set encryption.type=wireguard
        --set encryption.nodeEncryption=true
        {% endif %}
      changed_when: true
      tags: [cilium]

    - name: "Esperar a que Cilium esté listo en todos los nodos"
      ansible.builtin.command: "kubectl -n kube-system rollout status ds/cilium --timeout=300s"
      changed_when: false
      tags: [cilium]

    - name: "Esperar a que los nodos estén Ready"
      ansible.builtin.command: "kubectl wait --for=condition=Ready nodes --all --timeout=300s"
      changed_when: false
      tags: [cilium]

    # ---------- CLIs de observabilidad (cilium, hubble) ----------
    - name: "Instalar cilium CLI y hubble CLI en el master"
      ansible.builtin.shell: |
        set -e
        cd /tmp
        if ! command -v cilium >/dev/null; then
          curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-amd64.tar.gz{,.sha256sum}
          sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
          tar xzf cilium-linux-amd64.tar.gz -C /usr/local/bin
        fi
        if ! command -v hubble >/dev/null; then
          curl -L --fail --remote-name-all https://github.com/cilium/hubble/releases/download/{{ hubble_cli_version }}/hubble-linux-amd64.tar.gz{,.sha256sum}
          sha256sum --check hubble-linux-amd64.tar.gz.sha256sum
          tar xzf hubble-linux-amd64.tar.gz -C /usr/local/bin
        fi
      args: { executable: /bin/bash }
      changed_when: false
      tags: [tools]

    # ---------- Namespaces ----------
    - name: "Crear namespaces"
      ansible.builtin.shell: "kubectl create ns {{ item }} --dry-run=client -o yaml | kubectl apply -f -"
      loop: ["{{ ns_cp }}", "{{ ns_ran }}", "{{ ns_up }}"]
      changed_when: false
      tags: [namespaces, open5gs, ueransim]

    # ---------- Multus + NAD por interfaz (Fase 1, solo con deploy_multus) ----------
    # Cilium va con cni.exclusive=false (arriba): si no, renombra la config de
    # Multus en /etc/cni/net.d y la segunda interfaz nunca aparece.
    - name: "Descargar el manifiesto de Multus thick {{ multus_version }}"
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/{{ multus_version }}/deployments/multus-daemonset-thick.yml"
        dest: "{{ work_dir }}/multus-daemonset-thick.yml"
        mode: "0644"
      when: deploy_multus | bool
      tags: [multus]

    # El manifiesto monta /etc/cni/net.d y /opt/cni/bin del host. Se cambian
    # por las rutas que usa k3s (PLAY 3b); si coinciden, no cambia nada.
    - name: "Ajustar los hostPath de Multus a las rutas de CNI de k3s"
      ansible.builtin.replace:
        path: "{{ work_dir }}/multus-daemonset-thick.yml"
        regexp: "{{ item.re }}"
        replace: "{{ item.to }}"
      loop:
        - { re: 'path: /etc/cni/net\.d$', to: "path: {{ cni_conf_dir | default(cni_conf_dir_default) }}" }
        - { re: 'path: /opt/cni/bin$', to: "path: {{ cni_bin_dir | default(cni_bin_dir_default) }}" }
      when: deploy_multus | bool
      tags: [multus]

    # Desde Multus v4.1.0 el daemon busca los plugins delegados (cilium-cni,
    # ipvlan, static) en su propio sistema de ficheros y solo hace chroot al
    # ejecutarlos: el directorio de binarios tiene que estar montado en el
    # contenedor kube-multus en la MISMA ruta que en el host. El manifiesto de
    # v4.0.2 no lo monta y la imagen :snapshot-thick ya se comporta así.
    - name: "Montar los binarios CNI en el contenedor kube-multus"
      ansible.builtin.replace:
        path: "{{ work_dir }}/multus-daemonset-thick.yml"
        regexp: '(            - name: cni\n              mountPath: /host/etc/cni/net\.d\n)(?!            - name: cnibin)'
        replace: '\1            - name: cnibin\n              mountPath: {{ cni_bin_dir | default(cni_bin_dir_default) }}\n'
      when: deploy_multus | bool
      tags: [multus]

    - name: "El manifiesto de Multus monta los binarios CNI en kube-multus"
      ansible.builtin.command: >-
        grep -A1 -- "- name: cnibin" {{ work_dir }}/multus-daemonset-thick.yml
      register: multus_cnibin
      when: deploy_multus | bool
      changed_when: false
      failed_when: "('mountPath: ' ~ (cni_bin_dir | default(cni_bin_dir_default))) not in multus_cnibin.stdout"
      tags: [multus]

    - name: "Instalar Multus (thick daemonset)"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/multus-daemonset-thick.yml"
      register: multus_apply
      when: deploy_multus | bool
      changed_when: "'configured' in multus_apply.stdout or 'created' in multus_apply.stdout"
      tags: [multus]

    # El manifiesto de v4.0.2 usa la imagen móvil :snapshot-thick, y el daemon
    # actual hace list/watch de pods; el ClusterRole de v4.0.2 solo da get/update.
    - name: "RBAC de Multus: list y watch de pods (daemon :snapshot-thick actual)"
      ansible.builtin.command: >-
        kubectl patch clusterrole multus --type=json
        -p='[{"op":"replace","path":"/rules/1/verbs","value":["get","list","update","watch"]}]'
      register: multus_rbac
      when: deploy_multus | bool
      changed_when: "'no change' not in multus_rbac.stdout"
      tags: [multus]

    - name: "Esperar a Multus en todos los nodos"
      ansible.builtin.command: "kubectl -n kube-system rollout status ds/kube-multus-ds --timeout=300s"
      when: deploy_multus | bool
      changed_when: false
      tags: [multus]

    # Si un agente de Cilium con cni-exclusive=true vio la config de Multus, la
    # renombró a 00-multus.conf.cilium_bak y Multus no la vuelve a escribir sola
    # (solo reacciona a cambios en 05-cilium.conflist). Se regenera reiniciando
    # el DaemonSet; Cilium ya corre con cni-exclusive=false (rollOutCiliumPods).
    - name: "¿Está activa la config de Multus en cada nodo?"
      ansible.builtin.stat:
        path: "{{ cni_conf_dir | default(cni_conf_dir_default) }}/00-multus.conf"
      delegate_to: "{{ item }}"
      loop: "{{ groups['cluster'] }}"
      register: multus_conf
      when: deploy_multus | bool
      tags: [multus]

    - name: "Regenerar la config de Multus donde falte (reinicio del DaemonSet)"
      ansible.builtin.shell: |
        kubectl -n kube-system rollout restart ds/kube-multus-ds
        kubectl -n kube-system rollout status ds/kube-multus-ds --timeout=300s
      when:
        - deploy_multus | bool
        - multus_conf.results | rejectattr('stat.exists') | list | length > 0
      changed_when: true
      tags: [multus]

    - name: "La config de Multus está activa en todos los nodos"
      ansible.builtin.stat:
        path: "{{ cni_conf_dir | default(cni_conf_dir_default) }}/00-multus.conf"
      delegate_to: "{{ item }}"
      loop: "{{ groups['cluster'] }}"
      register: multus_conf_final
      until: multus_conf_final.stat.exists
      retries: 10
      delay: 3
      when: deploy_multus | bool
      tags: [multus]

    - name: "Quitar la copia que dejó Cilium (00-multus.conf.cilium_bak)"
      ansible.builtin.file:
        path: "{{ cni_conf_dir | default(cni_conf_dir_default) }}/00-multus.conf.cilium_bak"
        state: absent
      delegate_to: "{{ item }}"
      loop: "{{ groups['cluster'] }}"
      when: deploy_multus | bool
      tags: [multus]

    - name: "Generar los NetworkAttachmentDefinition (access y n6)"
      ansible.builtin.template:
        src: templates/multus-nads.yaml.j2
        dest: "{{ work_dir }}/multus-nads.yaml"
        mode: "0644"
      when: deploy_multus | bool
      tags: [multus]

    - name: "Aplicar los NAD"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/multus-nads.yaml"
      register: nads_apply
      when: deploy_multus | bool
      changed_when: "'configured' in nads_apply.stdout or 'created' in nads_apply.stdout"
      tags: [multus]

    # ---------- Fase 2: admisión a las redes dedicadas (Kyverno) ----------
    - name: "Fase 2: admisión con Kyverno"
      when: deploy_multus | bool
      tags: [admission, multus]
      block:
        - name: "Añadir repo Helm de Kyverno"
          ansible.builtin.command: "helm repo add kyverno https://kyverno.github.io/kyverno/"
          register: kyverno_repo
          changed_when: "'has been added' in kyverno_repo.stdout"
          failed_when: kyverno_repo.rc != 0 and 'already exists' not in kyverno_repo.stderr

        - name: "Instalar/actualizar Kyverno (chart {{ kyverno_chart_version }})"
          ansible.builtin.command: >
            helm upgrade --install kyverno kyverno/kyverno
            --version {{ kyverno_chart_version }}
            --namespace kyverno --create-namespace
            --wait --timeout 10m
          changed_when: true

        # Solo el documento de redes dedicadas; el de identidad de NF se
        # aplica a mano (ver k8s/admission/README.md).
        - name: "Leer la política de admisión de redes dedicadas"
          ansible.builtin.set_fact:
            multus_guard: >-
              {{ lookup('ansible.builtin.file', repo_root + '/k8s/admission/kyverno-redes-dedicadas.yaml')
                 | from_yaml_all | selectattr('metadata.name', 'equalto', 'kcd-multus-network-guard') | first }}

        # Las IP de la política están escritas en el YAML (para poder aplicarlo
        # a mano). Si group_vars cambia y la política no, se rechazarían los
        # pods legítimos: mejor fallar aquí.
        - name: "Las IP de la política coinciden con group_vars"
          ansible.builtin.assert:
            that:
              - (multus_guard | to_json) is search(item | regex_escape)
            fail_msg: "{{ item }} no aparece en kcd-multus-network-guard; actualiza k8s/admission/kyverno-redes-dedicadas.yaml"
            quiet: true
          loop:
            - "{{ amf_n2_ip }}/{{ access_cidr.split('/')[1] }}"
            - "{{ gnb_access_ip }}/{{ access_cidr.split('/')[1] }}"
            - "{{ upf_n3_ip }}/{{ access_cidr.split('/')[1] }}"
            - "{{ upf_n6_ip }}/{{ n6_cidr.split('/')[1] }}"

        - name: "Escribir la política con el modo elegido ({{ kyverno_multus_guard_action }})"
          ansible.builtin.copy:
            content: "{{ multus_guard | combine({'spec': {'validationFailureAction': kyverno_multus_guard_action}}, recursive=true) | to_nice_yaml(indent=2) }}"
            dest: "{{ work_dir }}/kcd-multus-network-guard.yaml"
            mode: "0644"

        - name: "Aplicar kcd-multus-network-guard"
          ansible.builtin.command: "kubectl apply -f {{ work_dir }}/kcd-multus-network-guard.yaml"
          register: guard_apply
          changed_when: "'configured' in guard_apply.stdout or 'created' in guard_apply.stdout"

        - name: "Esperar a que la política esté lista"
          ansible.builtin.command: "kubectl wait --for=condition=Ready clusterpolicy/kcd-multus-network-guard --timeout=120s"
          changed_when: false

    # ---------- Fase 2: MultiNetworkPolicy (multi-networkpolicy-iptables) ----------
    - name: "Fase 2: multi-networkpolicy-iptables"
      when:
        - deploy_multus | bool
        - deploy_multi_networkpolicy | bool
      tags: [mnp, multus]
      block:
        - name: "Descargar el manifiesto de multi-networkpolicy-iptables {{ multi_networkpolicy_version }}"
          ansible.builtin.get_url:
            url: "https://raw.githubusercontent.com/k8snetworkplumbingwg/multi-networkpolicy-iptables/{{ multi_networkpolicy_version }}/deploy.yml"
            dest: "{{ work_dir }}/multi-networkpolicy-iptables.yml"
            mode: "0644"

        # Ajustes para este clúster: imagen del tag fijado (no :snapshot),
        # socket de containerd de k3s y plugin ipvlan (por defecto solo
        # gestiona macvlan).
        - name: "Fijar la imagen al tag {{ multi_networkpolicy_version }}"
          ansible.builtin.replace:
            path: "{{ work_dir }}/multi-networkpolicy-iptables.yml"
            regexp: '(multi-networkpolicy-iptables):(snapshot|latest)'
            replace: '\1:{{ multi_networkpolicy_version }}'

        - name: "Socket de containerd de k3s"
          ansible.builtin.replace:
            path: "{{ work_dir }}/multi-networkpolicy-iptables.yml"
            regexp: '/run/containerd/containerd\.sock'
            replace: '/run/k3s/containerd/containerd.sock'

        - name: "Gestionar interfaces ipvlan (si ya hay --network-plugins)"
          ansible.builtin.replace:
            path: "{{ work_dir }}/multi-networkpolicy-iptables.yml"
            regexp: '--network-plugins=[A-Za-z0-9,-]+'
            replace: '--network-plugins=ipvlan'

        - name: "¿El manifiesto ya trae --network-plugins?"
          ansible.builtin.slurp:
            src: "{{ work_dir }}/multi-networkpolicy-iptables.yml"
          register: mnp_manifest_pre

        - name: "Gestionar interfaces ipvlan (si no lo trae, tras --host-prefix)"
          ansible.builtin.replace:
            path: "{{ work_dir }}/multi-networkpolicy-iptables.yml"
            regexp: '^(\s+)- "?--host-prefix=([^"\n]+)"?$'
            replace: '\1- "--host-prefix=\2"\n\1- "--network-plugins=ipvlan"'
          when: (mnp_manifest_pre.content | b64decode) is not search('--network-plugins=')

        - name: "Leer el manifiesto ajustado"
          ansible.builtin.slurp:
            src: "{{ work_dir }}/multi-networkpolicy-iptables.yml"
          register: mnp_manifest

        # Si el manifiesto de upstream cambió de forma, mejor fallar aquí que
        # desplegar un daemon que no filtra ipvlan.
        - name: "El manifiesto tiene los ajustes"
          ansible.builtin.assert:
            that:
              - (mnp_manifest.content | b64decode) is search('--network-plugins=ipvlan')
              - (mnp_manifest.content | b64decode) is search('/run/k3s/containerd/containerd.sock')
            fail_msg: "No se pudo ajustar deploy.yml de multi-networkpolicy-iptables; revisa el manifiesto del tag {{ multi_networkpolicy_version }}."

        - name: "Instalar multi-networkpolicy-iptables"
          ansible.builtin.command: "kubectl apply -f {{ work_dir }}/multi-networkpolicy-iptables.yml"
          register: mnp_apply
          changed_when: "'configured' in mnp_apply.stdout or 'created' in mnp_apply.stdout"

        - name: "Existe la CRD MultiNetworkPolicy"
          ansible.builtin.command: "kubectl get crd multi-networkpolicies.k8s.cni.cncf.io"
          changed_when: false

        - name: "Copiar las MultiNetworkPolicy"
          ansible.builtin.copy:
            src: "{{ repo_root }}/k8s/multinetwork/"
            dest: "{{ work_dir }}/k8s/multinetwork/"
            mode: "0644"

        - name: "Aplicar las MultiNetworkPolicy (access y n6)"
          ansible.builtin.command: "kubectl apply -k {{ work_dir }}/k8s/multinetwork/"
          register: mnp_policies
          changed_when: "'configured' in mnp_policies.stdout or 'created' in mnp_policies.stdout"

    # ---------- metrics-server ----------
    - name: "Instalar metrics-server"
      ansible.builtin.command: >
        kubectl apply -f
        https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
      changed_when: false
      tags: [metrics]

    - name: "¿metrics-server ya tiene --kubelet-insecure-tls?"
      ansible.builtin.command: >
        kubectl -n kube-system get deployment metrics-server
        -o jsonpath={.spec.template.spec.containers[0].args}
      register: ms_args
      changed_when: false
      tags: [metrics]

    - name: "Permitir kubelet-insecure-tls en metrics-server (testbed)"
      ansible.builtin.command: >
        kubectl -n kube-system patch deployment metrics-server --type=json
        -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
      when: "'kubelet-insecure-tls' not in ms_args.stdout"
      changed_when: true
      tags: [metrics]

    # ---------- Open5GS (chart OCI de Gradiant) ----------
    # El core se despliega en DOS releases del mismo chart.
    #   1) open5gs-up (ns 5g-up, borde)   -> solo el UPF (plano de usuario)
    #   2) open5gs-cp (ns 5g-cp, central) -> plano de control + MongoDB
    # El UPF va PRIMERO: el SMF resuelve por DNS el Service N4 del UPF al
    # arrancar y aborta si no existe.
    - name: "Copiar values de Open5GS al master"
      ansible.builtin.copy:
        src: "{{ repo_root }}/k8s/helm-values/{{ item }}"
        dest: "{{ work_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - open5gs-values.yaml
        - open5gs-upf-values.yaml
      tags: [open5gs]

    - name: "Generar los values extra de Multus (Fase 1)"
      ansible.builtin.template:
        src: "templates/{{ item }}.j2"
        dest: "{{ work_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - open5gs-cp-multus-values.yaml
        - open5gs-upf-multus-values.yaml
      when: deploy_multus | bool
      tags: [open5gs, multus]

    # Config completa de las NF (customOpen5gsConfig): el AMF si hay Multus o
    # TLS; el resto de NF solo con TLS. Ver la plantilla.
    - name: "Generar la config de las NF (redes dedicadas y/o mTLS)"
      ansible.builtin.template:
        src: templates/open5gs-cp-nf-config-values.yaml.j2
        dest: "{{ work_dir }}/open5gs-cp-nf-config-values.yaml"
        mode: "0644"
      when: (deploy_multus | bool) or (sbi_tls | bool)
      tags: [open5gs, multus, tls]

    # ---------- Fase 4: PKI de la SBI (CA propia + un certificado por NF) ----------
    - name: "Fase 4: certificados de la SBI"
      when: sbi_tls | bool
      tags: [open5gs, tls]
      block:
        - name: "Script de la PKI de la SBI"
          ansible.builtin.template:
            src: templates/sbi-pki.sh.j2
            dest: /usr/local/sbin/kcd-sbi-pki.sh
            mode: "0700"

        - name: "Generar la CA y los certificados que falten ({{ sbi_tls_dir }})"
          ansible.builtin.command: /usr/local/sbin/kcd-sbi-pki.sh
          register: sbi_pki
          changed_when: "'nuevo:' in sbi_pki.stdout"

        - name: "Secret sbi-tls-<nf> con la CA, el certificado y la clave"
          ansible.builtin.shell: |
            set -o pipefail
            kubectl -n {{ ns_cp }} create secret generic sbi-tls-{{ item }} \
              --from-file=ca.crt={{ sbi_tls_dir }}/ca.crt \
              --from-file=tls.crt={{ sbi_tls_dir }}/{{ item }}.crt \
              --from-file=tls.key={{ sbi_tls_dir }}/{{ item }}.key \
              --dry-run=client -o yaml | kubectl apply -f -
          args: { executable: /bin/bash }
          loop: "{{ sbi_nfs + ['sbi-probe'] }}"
          register: sbi_secrets
          changed_when: "'configured' in sbi_secrets.stdout or 'created' in sbi_secrets.stdout"

    - name: "Anotar la IP actual del AMF (para saber si hay que reiniciar la RAN)"
      ansible.builtin.shell: >
        kubectl -n {{ ns_cp }} get pod -l app.kubernetes.io/name=amf
        -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || true
      register: amf_ip_antes
      changed_when: false
      tags: [open5gs]

    - name: "Desplegar el plano de usuario: UPF en {{ ns_up }} (release {{ open5gs_up_release }})"
      ansible.builtin.command: >
        helm upgrade --install {{ open5gs_up_release }} {{ open5gs_chart }}
        --version {{ open5gs_chart_version }}
        --namespace {{ ns_up }}
        -f {{ work_dir }}/open5gs-upf-values.yaml
        {% if deploy_multus | bool %}-f {{ work_dir }}/open5gs-upf-multus-values.yaml{% endif %}
        --wait --timeout 10m
      changed_when: true
      tags: [open5gs]

    # El chart no ofrece (que sepamos) initContainers propios: el policy
    # routing del pool de UE por n6 se añade con un patch idempotente. Un
    # 'helm upgrade' posterior lo conserva (merge a tres vías de Helm 3) y esta
    # tarea lo vuelve a comprobar en cada ejecución.
    - name: "Fase 1: generar el patch de policy routing del UPF"
      ansible.builtin.template:
        src: templates/upf-n6-route-patch.yaml.j2
        dest: "{{ work_dir }}/upf-n6-route-patch.yaml"
        mode: "0644"
      when: deploy_multus | bool
      tags: [open5gs, multus]

    - name: "Fase 1: policy routing del pool de UE por n6 en el UPF"
      ansible.builtin.command: >
        kubectl -n {{ ns_up }} patch deployment {{ open5gs_up_release }}-upf
        --type strategic --patch-file {{ work_dir }}/upf-n6-route-patch.yaml
      register: upf_patch
      when: deploy_multus | bool
      changed_when: "'no change' not in upf_patch.stdout"
      tags: [open5gs, multus]

    - name: "Esperar al UPF tras el patch"
      ansible.builtin.command: "kubectl -n {{ ns_up }} rollout status deployment/{{ open5gs_up_release }}-upf --timeout=300s"
      when:
        - deploy_multus | bool
        - upf_patch is changed
      changed_when: false
      tags: [open5gs, multus]

    - name: "Desplegar el plano de control: Open5GS en {{ ns_cp }} (hasta 15 min)"
      ansible.builtin.command: >
        helm upgrade --install {{ open5gs_release }} {{ open5gs_chart }}
        --version {{ open5gs_chart_version }}
        --namespace {{ ns_cp }}
        -f {{ work_dir }}/open5gs-values.yaml
        {% if deploy_multus | bool %}-f {{ work_dir }}/open5gs-cp-multus-values.yaml{% endif %}
        {% if (deploy_multus | bool) or (sbi_tls | bool) %}-f {{ work_dir }}/open5gs-cp-nf-config-values.yaml{% endif %}
        --wait --timeout 15m
      changed_when: true
      tags: [open5gs]

    # Un Secret nuevo no reinicia los pods que lo montan.
    - name: "Fase 4: reiniciar las NF si cambiaron los certificados"
      ansible.builtin.shell: |
        kubectl -n {{ ns_cp }} rollout restart deployment -l app.kubernetes.io/instance={{ open5gs_release }}
        kubectl -n {{ ns_cp }} rollout status deployment -l app.kubernetes.io/instance={{ open5gs_release }} --timeout=600s
      when:
        - sbi_tls | bool
        - (sbi_pki is changed) or (sbi_secrets is changed)
      changed_when: true
      tags: [open5gs, tls]

    # Pod de prueba de la SBI: el smoke y la demo de la Fase 4 salen de aquí,
    # no de dentro del AMF (en la Fase 6 Tetragon mata las herramientas de red
    # que se ejecuten en el AMF).
    - name: "Copiar y aplicar el pod de prueba de la SBI (sbi-probe)"
      ansible.builtin.copy:
        src: "{{ repo_root }}/k8s/manifests/sbi-probe.yaml"
        dest: "{{ work_dir }}/sbi-probe.yaml"
        mode: "0644"
      tags: [open5gs, tls]

    - name: "Aplicar sbi-probe.yaml"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/sbi-probe.yaml"
      register: probe_apply
      changed_when: "'configured' in probe_apply.stdout or 'created' in probe_apply.stdout"
      tags: [open5gs, tls]

    - name: "Reiniciar sbi-probe si cambió su certificado"
      ansible.builtin.command: "kubectl -n {{ ns_cp }} rollout restart deployment/sbi-probe"
      when:
        - sbi_tls | bool
        - sbi_secrets is changed
      changed_when: true
      tags: [open5gs, tls]

    - name: "Comprobar que el SMF apunta al UPF de {{ ns_up }} (N4)"
      ansible.builtin.shell: >
        kubectl -n {{ ns_cp }} get configmap {{ open5gs_release }}-smf -o yaml
        | grep -c "{{ open5gs_up_release }}-upf-pfcp.{{ ns_up }}"
      register: smf_n4
      changed_when: false
      failed_when: smf_n4.stdout | int < 1
      tags: [open5gs]

    - name: "Leer la IP del AMF tras el despliegue"
      ansible.builtin.shell: >
        kubectl -n {{ ns_cp }} get pod -l app.kubernetes.io/name=amf
        -o jsonpath='{.items[0].status.podIP}'
      register: amf_ip_despues
      changed_when: false
      tags: [open5gs]

    - name: "¿Existe ya la RAN simulada?"
      ansible.builtin.shell: >
        kubectl -n {{ ns_ran }} get deployment ueransim-gnb -o name 2>/dev/null || true
      register: ran_existe
      changed_when: false
      tags: [open5gs]

    # El gNB resuelve la IP del AMF solo al arrancar. Si el AMF cambió de IP
    # (p. ej. al moverse de nodo), hay que reiniciar gNB y luego UE.
    - name: "Reiniciar gNB y UE si el AMF cambió de IP"
      ansible.builtin.shell: |
        kubectl -n {{ ns_ran }} rollout restart deployment ueransim-gnb
        kubectl -n {{ ns_ran }} rollout status deployment ueransim-gnb --timeout=180s
        kubectl -n {{ ns_ran }} rollout restart deployment ueransim-ues
        kubectl -n {{ ns_ran }} rollout status deployment ueransim-ues --timeout=180s
      when:
        - ran_existe.stdout | length > 0
        - amf_ip_antes.stdout | length > 0
        - amf_ip_antes.stdout != amf_ip_despues.stdout
      changed_when: true
      tags: [open5gs]

    - name: "Esperar a que MongoDB esté listo"
      ansible.builtin.command: >
        kubectl -n {{ ns_cp }} wait --for=condition=Ready pod
        -l app.kubernetes.io/name=mongodb --timeout=240s
      changed_when: false
      tags: [open5gs, subscribers]

    # ---------- Suscriptor (lo inserta el 'populate' del chart) ----------
    - name: "Esperar a que el populate haya insertado el suscriptor"
      ansible.builtin.command: >
        kubectl -n {{ ns_cp }} rollout status
        deployment/{{ open5gs_release }}-populate --timeout=300s
      changed_when: false
      tags: [open5gs, subscribers]

    # ---------- Service headless N2 del AMF ----------
    - name: "Copiar y aplicar el Service headless N2 del AMF"
      ansible.builtin.copy:
        src: "{{ repo_root }}/k8s/manifests/amf-n2-headless.yaml"
        dest: "{{ work_dir }}/amf-n2-headless.yaml"
        mode: "0644"
      tags: [open5gs, ueransim]

    # Solo en plan B: con Multus el gNB llega al AMF por su IP en la red access.
    - name: "Aplicar amf-n2-headless.yaml (solo plan B)"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/amf-n2-headless.yaml"
      when: not (deploy_multus | bool)
      changed_when: false
      tags: [open5gs, ueransim]

    # ---------- UERANSIM (gNB + UE) ----------
    - name: "Copiar configs UERANSIM y manifiesto"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ work_dir }}/{{ item.dst }}"
        mode: "0644"
      loop:
        - { src: "{{ repo_root }}/k8s/ueransim/gnb.yaml", dst: "gnb.yaml" }
        - { src: "{{ repo_root }}/k8s/ueransim/ue.yaml", dst: "ue.yaml" }
        - { src: "{{ repo_root }}/k8s/manifests/ueransim.yaml", dst: "ueransim.yaml" }
      tags: [ueransim]

    - name: "Crear ConfigMaps de UERANSIM"
      ansible.builtin.shell: |
        kubectl -n {{ ns_ran }} create configmap ueransim-gnb-conf --from-file=gnb.yaml={{ work_dir }}/gnb.yaml --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n {{ ns_ran }} create configmap ueransim-ue-conf --from-file=ue.yaml={{ work_dir }}/ue.yaml --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false
      tags: [ueransim]

    - name: "Aplicar gNB + UE"
      ansible.builtin.command: "kubectl apply -f {{ work_dir }}/ueransim.yaml"
      changed_when: false
      tags: [ueransim]

    - name: "Fase 1: generar el patch del gNB"
      ansible.builtin.template:
        src: templates/ueransim-gnb-multus-patch.yaml.j2
        dest: "{{ work_dir }}/ueransim-gnb-multus-patch.yaml"
        mode: "0644"
      when: deploy_multus | bool
      tags: [ueransim, multus]

    - name: "Fase 1: gNB con N2/N3 sobre la red access (Multus)"
      ansible.builtin.command: >
        kubectl -n {{ ns_ran }} patch deployment ueransim-gnb
        --type strategic --patch-file {{ work_dir }}/ueransim-gnb-multus-patch.yaml
      register: gnb_patch
      when: deploy_multus | bool
      changed_when: "'no change' not in gnb_patch.stdout"
      tags: [ueransim, multus]

    - name: "Esperar a gNB y UE"
      ansible.builtin.command: "kubectl -n {{ ns_ran }} rollout status deployment/{{ item }} --timeout=300s"
      loop: [ueransim-gnb, ueransim-ues]
      changed_when: false
      tags: [ueransim, multus]

    # Se lee la anotación network-status que escribe Multus, sin kubectl exec:
    # así no depende de qué binarios deje ejecutar Tetragon dentro del AMF.
    - name: "Fase 1: comprobar las interfaces de Multus en AMF, UPF y gNB"
      ansible.builtin.command: >-
        kubectl -n {{ item.ns }} get pod -l app.kubernetes.io/name={{ item.app }}
        -o jsonpath={.items[*].metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}
      loop:
        - { ns: "{{ ns_cp }}", app: amf, iface: n2 }
        - { ns: "{{ ns_up }}", app: upf, iface: n3 }
        - { ns: "{{ ns_up }}", app: upf, iface: n6 }
        - { ns: "{{ ns_ran }}", app: ueransim-gnb, iface: access }
      register: multus_ifaces
      when: deploy_multus | bool
      changed_when: false
      retries: 10
      delay: 6
      until: multus_ifaces.stdout is search('"interface":\s*"' ~ item.iface ~ '"')
      tags: [ueransim, multus]

    - name: "Fase 1: el gNB hace NG Setup contra el AMF ({{ amf_n2_ip }})"
      ansible.builtin.command: "kubectl -n {{ ns_ran }} logs deploy/ueransim-gnb"
      register: gnb_logs
      retries: 20
      delay: 6
      until: "'NG Setup procedure is successful' in gnb_logs.stdout"
      when: deploy_multus | bool
      changed_when: false
      tags: [ueransim, multus]

    # ---------- Fase 6: Tetragon (cortar en el kernel) ----------
    - name: "Fase 6: Tetragon"
      when: deploy_tetragon | bool
      tags: [tetragon]
      block:
        - name: "Repo Helm de Cilium (también publica Tetragon)"
          ansible.builtin.command: "helm repo add cilium https://helm.cilium.io"
          register: tg_repo
          changed_when: "'has been added' in tg_repo.stdout"
          failed_when: tg_repo.rc != 0 and 'already exists' not in tg_repo.stderr

        - name: "Instalar/actualizar Tetragon (chart {{ tetragon_chart_version }})"
          ansible.builtin.command: >
            helm upgrade --install tetragon cilium/tetragon
            --version {{ tetragon_chart_version }}
            --namespace kube-system
            --set tetragon.enablePolicyFilter=true
            --wait --timeout 10m
          changed_when: true

        - name: "Esperar a las CRD de Tetragon"
          ansible.builtin.command: "kubectl get crd tracingpolicies.cilium.io tracingpoliciesnamespaced.cilium.io"
          register: tg_crd
          retries: 20
          delay: 6
          until: tg_crd.rc == 0
          changed_when: false

        - name: "Copiar k8s/tetragon al master"
          ansible.builtin.copy:
            src: "{{ repo_root }}/k8s/tetragon/"
            dest: "{{ work_dir }}/k8s/tetragon/"
            mode: "0644"

        - name: "Aplicar las políticas de Tetragon"
          ansible.builtin.command: "kubectl apply -k {{ work_dir }}/k8s/tetragon/"
          register: tg_policies
          changed_when: "'configured' in tg_policies.stdout or 'created' in tg_policies.stdout"

    # ---------- Fase 3: políticas de Cilium para la red de pods ----------
    # Un overlay por modo (k8s/cilium/README.md). --prune borra las
    # CNP del lab que ya no estén en el overlay (p. ej. las de N2/N3/N6 al
    # pasar del plan B a Multus) y nada más.
    - name: "Fase 3: políticas de Cilium del lab"
      when: apply_cilium_policies | bool
      tags: [policies]
      vars:
        policy_mode: "{{ ('multus' if (deploy_multus | bool) else 'una-red') ~ ('-tls' if (sbi_tls | bool) else '') }}"
      block:
        - name: "Copiar k8s/cilium al master"
          ansible.builtin.copy:
            src: "{{ repo_root }}/k8s/cilium/"
            dest: "{{ work_dir }}/cilium/"
            mode: "0644"

        - name: "Aplicar el overlay {{ policy_mode }}"
          ansible.builtin.command: >
            kubectl apply -k {{ work_dir }}/cilium/{{ policy_mode }}
            --prune -l kcd.io/policy-set=lab
            --prune-allowlist=cilium.io/v2/CiliumNetworkPolicy
          register: lab_policies
          changed_when: "'configured' in lab_policies.stdout or 'created' in lab_policies.stdout or 'pruned' in lab_policies.stdout"

        - name: "Todas las CNP del lab válidas"
          ansible.builtin.command: >
            kubectl get cnp -A -l kcd.io/policy-set=lab
            -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}={.status.conditions[0].status}{"\n"}{end}'
          register: lab_cnp_status
          retries: 10
          delay: 3
          until: lab_cnp_status.stdout is not search('=False')
          changed_when: false

    - name: "Fase 3: WireGuard activo en los agentes de Cilium"
      ansible.builtin.command: "kubectl -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg encrypt status"
      register: wg_status
      when: node_encryption | default(false) | bool
      changed_when: false
      failed_when: wg_status.rc != 0 or 'Wireguard' not in wg_status.stdout
      tags: [cilium, policies]

    - name: "Mensaje final"
      ansible.builtin.debug:
        msg: >
          Testbed desplegado en modo {{ 'redes dedicadas (Multus)' if (deploy_multus | bool) else 'plan B (una red)' }},
          SBI {{ 'con mTLS' if (sbi_tls | bool) else 'en claro' }}.
          Pruebas: docs/pruebas-fase1.md (redes), docs/pruebas-fase2.md (admisión
          y MultiNetworkPolicy), docs/pruebas-fase3.md (Cilium),
          docs/pruebas-fase4.md (mTLS), docs/pruebas-fase6.md (Tetragon).
          Smoke: make smoke. Matriz sin clúster: make policy-matrix.
      tags: [always]
