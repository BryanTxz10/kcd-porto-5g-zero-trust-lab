# hosts.ini — INVENTARIO: lista de máquinas que Ansible va a configurar.
# ================== EDITA ESTO ==================
# Pon las IP de tus 4 VMs y el usuario SSH con el que entras.
# 'ansible_user' = usuario con el que te conectas por SSH y que puede hacer sudo.
# Valores por defecto = los de docs/guia-vms-realista.md (red mgmt VMnet8 NAT
# 192.168.100.0/24 de VMware, usuario bryantxz10).
#
# Reglas:
#   - [master]  -> el nodo control-plane de k3s (1 solo).
#   - [workers] -> los nodos trabajadores (1 o más).
#   - [dn]      -> la red de datos: router N6 (dn-gw). NO es nodo de k3s.
#   - No cambies los nombres de los grupos (el playbook los usa).
#   - ansible_host debe ser la IP de la red mgmt (k3s la usa como --node-ip
#     y Cilium como dirección del API server).
#   - Las IP de las redes access (10.10.0.0/24) y n6 (10.10.6.0/24) NO van
#     aquí: en los workers esas NIC no llevan IP (son el padre de la ipvlan
#     de Multus) y en dn-gw la IP de n6 está en host_vars/dn-gw.yml.

[master]
node-master ansible_host=192.168.100.10 ansible_user=bryantxz10

[workers]
node-worker1 ansible_host=192.168.100.11 ansible_user=bryantxz10
node-worker2 ansible_host=192.168.100.12 ansible_user=bryantxz10

# Red de datos (N6). Solo hace falta con deploy_multus: true (group_vars).
# Con deploy_multus: false puedes dejarla apagada o comentar la línea.
[dn]
dn-gw ansible_host=192.168.100.13 ansible_user=bryantxz10

# Grupo lógico con los nodos de Kubernetes (no editar). dn-gw queda fuera a
# propósito: los plays de k3s/Cilium usan 'cluster', no 'all'.
[cluster:children]
master
workers
