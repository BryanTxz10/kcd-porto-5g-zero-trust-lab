# SBI (HTTP/2, TCP 7777) solo entre identidades de NF del core.
# La identidad es la de Cilium, derivada de las etiquetas que pone el chart
# (app.kubernetes.io/name + app.kubernetes.io/instance=open5gs-cp). Un pod
# que no sea una de estas NF (impostor en 5g-cp, atacante en 5g-ran, el UPF)
# no llega a la SBI. Que nadie pueda ponerse esas etiquetas es cosa de la
# admisión (bootstrap/admission/).
# El NRF tiene su propia política con L7 (02-nrf-sbi-l7.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sbi-identidad
  namespace: 5g-cp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: open5gs-cp
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [amf, ausf, bsf, nssf, pcf, scp, smf, udm, udr]
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: 5g-cp
            app.kubernetes.io/instance: open5gs-cp
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [amf, ausf, bsf, nrf, nssf, pcf, scp, smf, udm, udr]
      toPorts:
        - ports:
            - { port: "7777", protocol: TCP }
