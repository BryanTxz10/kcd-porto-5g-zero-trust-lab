name: CI — Validación de despliegue

# Valida todo lo que se ejecuta o se aplica en el clúster antes de desplegar:
# scripts bash, playbook Ansible, políticas (Kustomize) y scripts Python.

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Principio de mínimo privilegio: el token solo puede leer el repositorio.
permissions:
  contents: read

# Cancela ejecuciones antiguas de la misma rama/PR (ahorra minutos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-shell:
    name: Scripts bash (shellcheck + sintaxis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (findings informativos, no bloquea)
        run: |
          mapfile -t files < <(find scripts attacks k8s -name '*.sh' | sort)
          shellcheck --severity=error "${files[@]}" || true
      - name: bash -n (sintaxis, BLOQUEA)
        run: |
          rc=0
          while IFS= read -r f; do
            if bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; rc=1; fi
          done < <(find scripts attacks k8s -name '*.sh' | sort)
          exit $rc
      - name: make lint
        run: make lint

  lint-yaml:
    name: YAML (yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar yamllint
        run: pipx install yamllint || pip install --user yamllint
      - name: yamllint
        run: yamllint -c .yamllint.yml .

  validate-ansible:
    name: Ansible (syntax-check + ansible-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Ansible
        run: pipx install --include-deps ansible-core || pip install --user ansible-core
      - name: Instalar ansible-lint
        run: pipx install ansible-lint || pip install --user ansible-lint
      - name: ansible-playbook --syntax-check (BLOQUEA)
        working-directory: ansible
        run: ansible-playbook -i inventory/hosts.ini site.yml --syntax-check
      - name: ansible-lint (perfil min, BLOQUEA)
        run: ansible-lint ansible/site.yml

  validate-manifests:
    name: Políticas (kustomize build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUSTOMIZE_VERSION: v5.4.3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar kustomize
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize
          kustomize version
      - name: kustomize build de las políticas (BLOQUEA)
        run: make kustomize-check

  lint-python:
    name: Python (compilación + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compilar todos los scripts (BLOQUEA)
        run: python -m compileall -q attacks scripts
      - name: Matriz de políticas en los dos modos (BLOQUEA)
        run: |
          pip install pyyaml==6.0.2
          python scripts/policy-matrix.py .
      - name: ruff (lint de errores, no bloquea)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 . || true

  spec2policy:
    name: spec2policy (ruff + pytest + salida al día)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/spec2policy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/spec2policy/requirements.txt
      - name: Dependencias fijadas
        run: pip install -r requirements.txt
      - name: ruff (BLOQUEA)
        run: |
          ruff check .
          ruff format --check .
      - name: pytest (BLOQUEA)
        run: python -m pytest -q
      - name: Los ejemplos commiteados coinciden con lo generado (BLOQUEA)
        working-directory: .
        run: |
          make spec2policy SPEC2POLICY_PY=python
          git diff --exit-code -- tools/spec2policy/examples/out
