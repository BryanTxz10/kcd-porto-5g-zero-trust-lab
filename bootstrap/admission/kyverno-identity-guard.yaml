# kyverno-identity-guard.yaml — Control de admisión que vuelve NO FORJABLE el
# label de identidad de C2 (punto 2 / §3.2 opción B; cierra RM-05).
#
# Regla: en el namespace 5g-cp, SOLO un desplegador autorizado (y los
# controladores del sistema que crean los pods hijos) pueden crear cargas que
# lleven el label de identidad `cib46-nf-type=core-nf`. Cualquier otro principal
# (p. ej. el atacante que hace `kubectl apply` de un pod impostor CON el label)
# es RECHAZADO en la admisión, antes de arrancar.
#
# Requisito: Kyverno instalado (`helm install kyverno kyverno/kyverno -n kyverno`).
# background: false es obligatorio porque la regla usa request.userInfo.
#
# AJUSTA la allowlist a tu clúster:
#  - Sustituye el SA del desplegador autorizado (quien aplica los Deployments de
#    Open5GS; p. ej. tu usuario de kubectl o el SA del pipeline).
#  - Mantén los SA de los controladores (crean los pods hijos de los Deployments).
#
# ALCANCE (decláralo en la tesis): este control detiene al adversario que
# despliega un impostor CON el label siendo un principal distinto del desplegador
# autorizado (tu A2′/A2‴). NO detiene a un pipeline autorizado ya comprometido
# (problema de supply-chain → firma de imágenes/Sigstore = trabajo futuro).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cib46-identity-guard
  annotations:
    policies.kyverno.io/title: CIB46 Identity Guard (C2 non-forgeable label)
    policies.kyverno.io/description: >-
      Solo principales autorizados pueden crear cargas con el label de identidad
      de workload cib46-nf-type=core-nf en 5g-cp. Vuelve no forjable la identidad
      de C2 y habilita el vector de prueba A2‴.
spec:
  validationFailureAction: Enforce   # usa Audit primero para observar sin bloquear
  background: false
  rules:
    - name: solo-desplegador-autorizado-pone-label-identidad
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - ReplicaSet
                - StatefulSet
                - DaemonSet
                - Job
              namespaces:
                - 5g-cp
      # Solo aplica a cargas que llevan el label de identidad reservado.
      preconditions:
        all:
          - key: "{{ request.object.metadata.labels.\"cib46-nf-type\" || request.object.spec.template.metadata.labels.\"cib46-nf-type\" || '' }}"
            operator: Equals
            value: core-nf
      validate:
        message: >-
          El label de identidad 'cib46-nf-type=core-nf' está reservado: solo el
          desplegador autorizado puede asignarlo en 5g-cp. Solicitud rechazada
          (vector A2‴ bloqueado en admisión).
        deny:
          conditions:
            all:
              - key: "{{ request.userInfo.username }}"
                operator: AllNotIn
                value:
                  # --- AJUSTA: desplegador(es) legítimo(s) de las NF de Open5GS ---
                  - "system:serviceaccount:5g-cp:open5gs-deployer"
                  # --- Controladores del sistema (crean los pods hijos) ---
                  - "system:serviceaccount:kube-system:replicaset-controller"
                  - "system:serviceaccount:kube-system:deployment-controller"
                  - "system:serviceaccount:kube-system:statefulset-controller"
                  - "system:serviceaccount:kube-system:daemon-set-controller"
                  - "system:serviceaccount:kube-system:job-controller"
                  - "system:serviceaccount:kube-system:generic-garbage-collector"

    # ───────────────────────────────────────────────────────────────────────
    # Perfil A (hallazgo 4): el label del gNB legítimo también es NO FORJABLE.
    # La política N2 (c1/03) confía en app.kubernetes.io/name=ueransim-gnb; sin
    # esta guarda, cualquier pod de 5g-ran podría ponerse ese label y abrir N2
    # al AMF. Aquí se rechaza en admisión a quien intente forjarlo.
    # ───────────────────────────────────────────────────────────────────────
    - name: solo-desplegador-autorizado-pone-label-gnb
      match:
        any:
          - resources:
              kinds: [Pod, Deployment, ReplicaSet, StatefulSet, DaemonSet, Job]
              namespaces: [5g-ran]
      preconditions:
        all:
          - key: "{{ request.object.metadata.labels.\"app.kubernetes.io/name\" || request.object.spec.template.metadata.labels.\"app.kubernetes.io/name\" || '' }}"
            operator: Equals
            value: ueransim-gnb
      validate:
        message: >-
          El label 'app.kubernetes.io/name=ueransim-gnb' está reservado para la
          estación base legítima: solo el desplegador autorizado puede asignarlo
          en 5g-ran. Un pod que intente suplantar al gNB es rechazado en admisión.
        deny:
          conditions:
            all:
              - key: "{{ request.userInfo.username }}"
                operator: AllNotIn
                value:
                  # --- AJUSTA: desplegador(es) legítimo(s) de UERANSIM ---
                  - "system:serviceaccount:5g-ran:ueransim-deployer"
                  # --- Controladores del sistema ---
                  - "system:serviceaccount:kube-system:replicaset-controller"
                  - "system:serviceaccount:kube-system:deployment-controller"
                  - "system:serviceaccount:kube-system:statefulset-controller"
                  - "system:serviceaccount:kube-system:daemon-set-controller"
                  - "system:serviceaccount:kube-system:job-controller"
                  - "system:serviceaccount:kube-system:generic-garbage-collector"
---
# ═══════════════════════════════════════════════════════════════════════════
# kcd-multus-network-guard — quién puede conectarse a las redes dedicadas
# (Fase 2, KCD Porto; solo con deploy_multus: true).
#
# Cilium no hace cumplir políticas en las interfaces de Multus. Pedir la red
# 'access' (radio: N2 y N3) o 'n6' (salida de los UE) es escribir una
# anotación en el pod; sin control, cualquier pod que pueda crearse en el
# clúster se sentaría en la red de la radio. Aquí eso pasa a ser una decisión
# de ADMISIÓN: el API server rechaza el pod antes de que exista.
#
#   5g-cp  -> solo el AMF puede pedir 'access' (n2 = 10.10.0.10)
#   5g-ran -> solo el gNB puede pedir 'access' (access = 10.10.0.20)
#   5g-up  -> solo el UPF puede pedir 'access' y 'n6' (10.10.0.30, 10.10.6.30)
#   resto  -> nadie pide redes de Multus
#
# Además: anotación solo en formato JSON (la forma corta "access,n6" se
# rechaza para poder inspeccionarla), sin referencias a NAD de otro
# namespace ("namespace": "5g-up" desde 5g-ran), y solo pods creados por un
# controlador (Deployment/StatefulSet/...): un Pod suelto, aunque copie las
# etiquetas del AMF, no puede pedir una red dedicada.
#
# Las IP deben coincidir con ansible/group_vars/all.yml. Ansible aplica SOLO
# este documento y comprueba esa coincidencia antes (site.yml, tag admission).
# El ClusterPolicy de arriba (cib46-identity-guard) es de la tesis y sigue
# siendo de aplicación manual: su allowlist hay que ajustarla al clúster.
#
# ALCANCE: decide QUÉ pide un pod, no QUIÉN es el administrador. Quien tenga
# credenciales de administrador puede crear un Deployment con las etiquetas
# del AMF y sus pods pasarán; eso lo cubre RBAC, no la admisión.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kcd-multus-network-guard
  annotations:
    policies.kyverno.io/title: Admisión a las redes dedicadas (Multus)
    policies.kyverno.io/description: >-
      Solo el AMF, el gNB y el UPF pueden pedir las redes access y n6 de
      Multus, con su IP fija y desde su namespace. Conectarse a la red de la
      radio es una decisión de admisión.
    # Las reglas se escriben para Pod y se comprueban en el pod que crea el
    # controlador; no se generan reglas automáticas para Deployment & co.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Enforce
  background: false            # usa request.userInfo
  rules:
    - name: anotacion-en-formato-json
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          La anotación k8s.v1.cni.cncf.io/networks debe estar en formato JSON
          (lista de objetos) para poder validarla. Pod rechazado.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\", '[') }}"
                operator: Equals
                value: false

    - name: redes-dedicadas-solo-en-el-core
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE] }
      exclude:
        any:
          - resources: { namespaces: [5g-cp, 5g-ran, 5g-up] }
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          Solo los namespaces 5g-cp, 5g-ran y 5g-up pueden pedir redes de
          Multus. Pod rechazado.
        deny: {}

    - name: sin-referencias-a-otro-namespace
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE], namespaces: [5g-cp, 5g-ran, 5g-up] }
      preconditions:
        all:
          - key: "{{ starts_with(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\" || '', '[') }}"
            operator: Equals
            value: true
      validate:
        message: >-
          Un pod solo puede usar los NAD de su propio namespace. Pod rechazado.
        deny:
          conditions:
            any:
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[?namespace].namespace }}"
                operator: AnyNotIn
                value: ["{{ request.namespace }}"]

    - name: solo-pods-de-un-controlador
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE], namespaces: [5g-cp, 5g-ran, 5g-up] }
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          Un Pod creado directamente no puede pedir redes dedicadas: solo los
          pods de un Deployment/StatefulSet/DaemonSet/Job. Pod rechazado
          (conectarse a la red de la radio es una decisión de admisión).
        deny:
          conditions:
            all:
              - key: "{{ request.userInfo.username }}"
                operator: AnyNotIn
                value:
                  # k3s puede crear los pods con la identidad del controller
                  # manager o con la SA de cada controlador: se aceptan ambas.
                  - system:kube-controller-manager
                  - system:serviceaccount:kube-system:replicaset-controller
                  - system:serviceaccount:kube-system:statefulset-controller
                  - system:serviceaccount:kube-system:daemon-set-controller
                  - system:serviceaccount:kube-system:job-controller

    - name: access-en-5g-cp-solo-amf
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE], namespaces: [5g-cp] }
      preconditions:
        all:
          - key: "{{ starts_with(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\" || '', '[') }}"
            operator: Equals
            value: true
      validate:
        message: >-
          En 5g-cp solo el AMF puede pedir la red 'access', como interfaz n2 y
          con la IP 10.10.0.10/24. Pod rechazado.
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.labels.\"app.kubernetes.io/name\" || '' }}"
                operator: NotEquals
                value: amf
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].name }}"
                operator: AnyNotIn
                value: [access]
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].interface }}"
                operator: AnyNotIn
                value: [n2]
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].ips[] }}"
                operator: AnyNotIn
                value: [10.10.0.10/24]

    - name: access-en-5g-ran-solo-gnb
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE], namespaces: [5g-ran] }
      preconditions:
        all:
          - key: "{{ starts_with(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\" || '', '[') }}"
            operator: Equals
            value: true
      validate:
        message: >-
          En 5g-ran solo el gNB puede pedir la red 'access', como interfaz
          access y con la IP 10.10.0.20/24. Pod rechazado.
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.labels.\"app.kubernetes.io/name\" || '' }}"
                operator: NotEquals
                value: ueransim-gnb
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].name }}"
                operator: AnyNotIn
                value: [access]
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].interface }}"
                operator: AnyNotIn
                value: [access]
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].ips[] }}"
                operator: AnyNotIn
                value: [10.10.0.20/24]

    - name: access-y-n6-en-5g-up-solo-upf
      match:
        any:
          - resources: { kinds: [Pod], operations: [CREATE, UPDATE], namespaces: [5g-up] }
      preconditions:
        all:
          - key: "{{ starts_with(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\" || '', '[') }}"
            operator: Equals
            value: true
      validate:
        message: >-
          En 5g-up solo el UPF puede pedir 'access' (n3, 10.10.0.30/24) y 'n6'
          (n6, 10.10.6.30/24). Pod rechazado.
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.labels.\"app.kubernetes.io/name\" || '' }}"
                operator: NotEquals
                value: upf
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].name }}"
                operator: AnyNotIn
                value: [access, n6]
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].interface }}"
                operator: AnyNotIn
                value: [n3, n6]
              - key: "{{ parse_json(request.object.metadata.annotations.\"k8s.v1.cni.cncf.io/networks\")[].ips[] }}"
                operator: AnyNotIn
                value: [10.10.0.30/24, 10.10.6.30/24]
