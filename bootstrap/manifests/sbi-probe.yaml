# sbi-probe.yaml — pod de prueba de la SBI en 5g-cp (Fases 3, 4 y 6).
#
# Sustituye al 'curl desde dentro del AMF' que hacía el smoke: en la Fase 6
# Tetragon mata cualquier herramienta de red que se ejecute en el AMF, así
# que las comprobaciones de la SBI salen de aquí.
#
# Identidad propia (app.kubernetes.io/name=sbi-probe): Cilium solo le deja
# llegar al NRF y, sin TLS, solo para GET de Nnrf_NFDiscovery
# (cilium-policies/lab/base/07-sbi-probe.yaml). Es la pieza de la demo de
# "la misma petición no autorizada al NRF" con y sin mTLS.
#
# Con sbi_tls: true monta el Secret sbi-tls-sbi-probe (CA + certificado de
# cliente firmado por la CA del lab, como una NF comprometida). Sin TLS el
# Secret no existe y el volumen queda vacío (optional: true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbi-probe
  namespace: 5g-cp
  labels: { app.kubernetes.io/name: sbi-probe }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: sbi-probe } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sbi-probe }
    spec:
      nodeSelector: { kubernetes.io/hostname: node-worker1 }
      automountServiceAccountToken: false
      containers:
        - name: probe
          image: nicolaka/netshoot:v0.13
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: sbi-tls, mountPath: /etc/open5gs/tls, readOnly: true }
      volumes:
        - name: sbi-tls
          secret:
            secretName: sbi-tls-sbi-probe
            optional: true
